name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest

    # No `services: postgres` here, deliberately. ApiFactory starts its own postgres:16
    # through Testcontainers and overwrites ConnectionStrings__Default when it does, so a
    # service container would sit unused while appearing to be what the tests run against.
    # Docker is already present on GitHub-hosted runners, which is all Testcontainers needs.

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/AssignmentSystem.sln

      - name: Build
        run: dotnet build backend/AssignmentSystem.sln --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test backend/AssignmentSystem.sln
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults
          retention-days: 7

  # The frontend and compose-build jobs land with M8. Adding them here would put main red
  # against a frontend/ that currently holds only a Dockerfile.
