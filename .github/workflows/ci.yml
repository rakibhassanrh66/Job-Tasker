name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assignment_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: assignment_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/AssignmentSystem.sln

      - name: Build
        run: dotnet build backend/AssignmentSystem.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/AssignmentSystem.sln --no-build --configuration Release --verbosity normal
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=assignment_system_test;Username=assignment_user;Password=ci_test_password"
          Jwt__Key: "ci-only-test-key-not-a-secret-min-32-bytes-long!!"
          Jwt__Issuer: "AssignmentSystem.Api"
          Jwt__Audience: "AssignmentSystem.Client"
